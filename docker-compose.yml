services:
  g1-manifest:
    build: .
    image: g1-manifest:latest
    container_name: G1-Manifest
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - g1-manifest-views:/data/views
      - g1-manifest-keys:/data/keys
    restart: unless-stopped

volumes:
  g1-manifest-views:
  g1-manifest-keys:
