apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: g1-manifest
  namespace: g1-manifest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: g1-manifest
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
