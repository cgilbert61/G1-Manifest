apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-manifest-netpol
  namespace: g1-manifest
spec:
  podSelector:
    matchLabels:
      app: g1-manifest
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress: []
