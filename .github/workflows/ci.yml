name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[host]" pytest build
      - name: Run unit and integration test suite
        run: pytest -v
      - name: Run consumer conformance suite
        run: pytest -v conformance/
      - name: Run reproducible end-to-end demo
        run: python -m examples.run_demo
      - name: Build and verify standalone wheel
        run: |
          python -m build --wheel
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/g1-manifest --check-mode
          /tmp/wheel-check/bin/estate-graph --help

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build G1-Manifest Docker image
        run: docker build -t g1-manifest:ci .
