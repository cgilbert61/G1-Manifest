apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace | default "g1-manifest" }}
data:
  G1_MANIFEST_PORT: {{ .Values.config.G1_MANIFEST_PORT | quote }}
  G1_MANIFEST_VIEWS_DIR: {{ .Values.config.G1_MANIFEST_VIEWS_DIR | quote }}
  G1_MANIFEST_SIGNING_DIR: {{ .Values.config.G1_MANIFEST_SIGNING_DIR | quote }}
