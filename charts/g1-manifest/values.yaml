replicaCount: 1
namespace: g1-manifest
image:
  repository: g1-manifest
  tag: "0.1.0"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8080
config:
  G1_MANIFEST_PORT: "8080"
  G1_MANIFEST_VIEWS_DIR: "/data/views"
  G1_MANIFEST_SIGNING_DIR: "/data/keys"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
